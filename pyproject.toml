[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "diskblame"
version = "0.1.2"
description = "Disk usage history: track what grows, diff snapshots, and explain files."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "uxuxs82"}]
keywords = [
    "disk",
    "disk-usage",
    "disk-space",
    "disk-analyzer",
    "storage",
    "filesystem",
    "cleanup",
    "cli",
    "sqlite",
    "du",
    "ncdu",
    "linux",
    "macos",
    "windows",
]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Filesystems",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/uxuxs82/diskblame"
Repository = "https://github.com/uxuxs82/diskblame"
Changelog = "https://github.com/uxuxs82/diskblame/blob/main/CHANGELOG.md"
Issues = "https://github.com/uxuxs82/diskblame/issues"

[project.scripts]
diskblame = "diskblame.cli:main"

[tool.setuptools.packages.find]
include = ["diskblame*"]
